<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">ShipProof Verification Pipeline Architecture</title>
  <description id="workflow-desc">Architecture of how ShipProof audits code from AI and developers before deployment.</description>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="920" height="480" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <rect width="920" height="44" rx="16" fill="#161b22"/>
  <rect y="24" width="920" height="20" fill="#161b22"/>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="22" r="6.5" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6.5" fill="#ffbd2e"/>
  <circle cx="68" cy="22" r="6.5" fill="#27c93f"/>
  <text x="460" y="28" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">ShipProof Verification Pipeline</text>

  <!-- Step 1: Input Code -->
  <g transform="translate(24, 68)">
    <rect width="192" height="385" rx="12" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.5"/>
    <rect width="192" height="38" rx="12" fill="#1f6feb"/>
    <rect y="24" width="192" height="14" fill="#1f6feb"/>
    <text x="96" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">1. Code Ingestion</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#c9d1d9">
      <text x="14" y="68" fill="#58a6ff" font-weight="700">[Sources]</text>
      <text x="14" y="96">• Human Coders</text>
      <text x="14" y="122">• AI / Vibe Coding</text>
      <text x="14" y="148">• Pull Requests</text>
      <text x="14" y="190" fill="#58a6ff" font-weight="700">[Frameworks]</text>
      <text x="14" y="218">• Next.js / React</text>
      <text x="14" y="244">• Express / Node</text>
      <text x="14" y="270">• FastAPI / Django</text>
      <text x="14" y="296">• Supabase / SQL</text>
      <line x1="14" y1="324" x2="178" y2="324" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="352" fill="#8b949e">Zero-config run</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <path d="M 216 260 L 244 260" stroke="#388bfd" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="244,255 252,260 244,265" fill="#388bfd"/>

  <!-- Step 2: AST & Defense Rules -->
  <g transform="translate(252, 68)">
    <rect width="202" height="385" rx="12" fill="url(#cardGrad)" stroke="#8957e5" stroke-width="1.5"/>
    <rect width="202" height="38" rx="12" fill="#8957e5"/>
    <rect y="24" width="202" height="14" fill="#8957e5"/>
    <text x="101" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">2. AST &amp; Rules</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">
      <text x="14" y="68" fill="#d2a8ff" font-weight="700">[Security &amp; Traps]</text>
      <text x="14" y="96">• SP108: Missing Auth</text>
      <text x="14" y="122">• SP501: Unmetered AI</text>
      <text x="14" y="148">• SP502: Stripe Hooks</text>
      <text x="14" y="174">• SP503: Supabase Keys</text>
      <text x="14" y="200">• SP307: N+1 DB Loops</text>
      <text x="14" y="226">• SP313: Serverless DB</text>
      <text x="14" y="266" fill="#d2a8ff" font-weight="700">[Deep AST Analysis]</text>
      <text x="14" y="294">• Router Trees</text>
      <text x="14" y="320">• Session Timeouts</text>
      <text x="14" y="352" fill="#8b949e">Fast heuristic scan</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <path d="M 454 260 L 482 260" stroke="#8957e5" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="482,255 490,260 482,265" fill="#8957e5"/>

  <!-- Step 3: Capacity & Scale -->
  <g transform="translate(490, 68)">
    <rect width="190" height="385" rx="12" fill="url(#cardGrad)" stroke="#d29922" stroke-width="1.5"/>
    <rect width="190" height="38" rx="12" fill="#b08800"/>
    <rect y="24" width="190" height="14" fill="#b08800"/>
    <text x="95" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">3. Scale &amp; Capacity</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">
      <text x="14" y="68" fill="#e3b341" font-weight="700">[Capacity Modeling]</text>
      <text x="14" y="96">• 10k to 1M scale</text>
      <text x="14" y="122">• DB connection pool</text>
      <text x="14" y="148">• CPU &amp; RAM sizing</text>
      <text x="14" y="190" fill="#e3b341" font-weight="700">[Load Testing]</text>
      <text x="14" y="218">• Steady &amp; peak load</text>
      <text x="14" y="244">• Stress &amp; spike tests</text>
      <text x="14" y="270">• Export k6 scripts</text>
      <line x1="14" y1="300" x2="176" y2="300" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="328" fill="#8b949e">Resource budget</text>
      <text x="14" y="352" fill="#8b949e">regression proof</text>
    </g>
  </g>

  <!-- Connector 3 -->
  <path d="M 680 260 L 708 260" stroke="#d29922" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="708,255 716,260 708,265" fill="#d29922"/>

  <!-- Step 4: Decision Gate -->
  <g transform="translate(716, 68)">
    <rect width="180" height="385" rx="12" fill="url(#cardGrad)" stroke="#2ea043" stroke-width="1.5"/>
    <rect width="180" height="38" rx="12" fill="#238636"/>
    <rect y="24" width="180" height="14" fill="#238636"/>
    <text x="90" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">4. Decision Gate</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9">
      <text x="14" y="68" fill="#3fb950" font-weight="700">[Output Modes]</text>
      <text x="14" y="96">• Terminal Cards</text>
      <text x="14" y="122">• AI Fix Prompts</text>
      <text x="14" y="148">• Step Summaries</text>
      <text x="14" y="174">• SARIF Output</text>
      <text x="14" y="200">• MCP Tools</text>
      <text x="14" y="238" fill="#3fb950" font-weight="700">[Final Verdict]</text>
      <rect x="14" y="250" width="152" height="30" rx="6" fill="#13231b" stroke="#2ea043"/>
      <text x="22" y="270" fill="#3fb950" font-weight="700" font-size="12">PASS_WITH_EVIDENCE</text>
      <rect x="14" y="290" width="152" height="30" rx="6" fill="#3c1e1e" stroke="#f85149"/>
      <text x="22" y="310" fill="#ff7b72" font-weight="700" font-size="12">BLOCK (if broken)</text>
    </g>
  </g>
</svg>
