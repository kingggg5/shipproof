name: Bug report
description: Report incorrect behavior or a false positive/negative.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets, private source, and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: ShipProof version
      placeholder: 0.10.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner rule or finding
        - Policy or gate
        - npm CLI
        - GitHub Action
        - MCP adapter
        - Budget or capacity model
        - Skill or installer
        - Documentation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
