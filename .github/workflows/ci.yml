name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check Python style and correctness
        run: |
          ruff check .
          ruff format --check .
      - name: Check Node.js syntax
        run: npm run lint:node
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skills tests
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s examples/demo-api/fixtures/after/tests -v
      - name: Composite action smoke test
        if: matrix.python-version == '3.12'
        uses: ./
        with:
          path: .
          format: sarif
          output: shipproof.sarif
          fail-on: high
      - name: Resource budget smoke test
        run: >-
          python skills/engineer-production-systems/scripts/check_budget.py
          --baseline examples/performance/baseline.json
          --current examples/performance/current.json
          --budget examples/performance/budget.json
      - name: Self-audit
        run: python skills/audit-production-readiness/scripts/scan_repo.py . --format markdown --fail-on high
      - name: Scanner regression budget
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark-scanner.py --files 1000
          --max-seconds 8 --max-memory-mb 256
      - name: Validate plugin manifests
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in (Path('.codex-plugin/plugin.json'), Path('.claude-plugin/plugin.json'))]"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test npm CLI
        run: npm run test:node
      - name: Install MCP contract-test peers
        if: matrix.node-version == '22'
        run: npm ci --include=dev --ignore-scripts
      - name: Test MCP SDK handshake
        if: matrix.node-version == '22'
        run: npm run test:mcp
      - name: Smoke-test the Python bridge
        if: matrix.node-version == '22'
        run: |
          node bin/shipproof.mjs doctor . --json
          node bin/shipproof.mjs budget --baseline examples/performance/baseline.json --current examples/performance/current.json --budget examples/performance/budget.json
          node bin/shipproof.mjs capacity --users 10000 --format json
          node bin/shipproof.mjs capacity --config examples/capacity/shipproof.config.json --export-k6 generated-load-test.js --format json
          node --check generated-load-test.js
          node bin/shipproof.mjs evidence . --list --format json
          node bin/shipproof.mjs scan . --fail-on high
      - name: Verify published file set
        run: npm run pack:check
      - name: Smoke-test the packed artifact
        if: matrix.node-version == '22'
        run: npm run test:package

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install coverage tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Enforce Python branch coverage
        run: npm run test:python:coverage
      - name: Enforce Node line coverage
        run: npm run test:node:coverage
