name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skills tests install.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Resource budget smoke test
        run: >-
          python skills/engineer-production-systems/scripts/check_budget.py
          --baseline examples/performance/baseline.json
          --current examples/performance/current.json
          --budget examples/performance/budget.json
      - name: Self-audit
        run: python skills/audit-production-readiness/scripts/scan_repo.py . --format markdown --fail-on high
      - name: Validate plugin manifests
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in (Path('.codex-plugin/plugin.json'), Path('.claude-plugin/plugin.json'))]"
