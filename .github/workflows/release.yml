name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kingggg5"
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify release source
        run: npm run check
      - id: release
        name: Validate tag and notes
        run: node scripts/release-info.mjs
      - name: Build npm tarball
        run: |
          mkdir release-artifacts
          npm pack --pack-destination release-artifacts
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish || echo "Package already published"
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPROOF_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SHIPPROOF_VERSION: ${{ steps.release.outputs.version }}
          SHIPPROOF_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          release_flags=(--verify-tag --title "ShipProof v${SHIPPROOF_VERSION}" --notes-file "${SHIPPROOF_NOTES}")
          if [[ "${SHIPPROOF_PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" "release-artifacts/kingggg5-shipproof-${SHIPPROOF_VERSION}.tgz" "${release_flags[@]}" || echo "Release already exists"
      - name: Maintain moving major tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SHIPPROOF_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          major_version="v${SHIPPROOF_VERSION%%.*}"
          git tag -fa "${major_version}" -m "Moving ${major_version} tag: tracks the latest reviewed ${major_version}.x release. Pin the exact version tag or commit SHA for immutable references." "${GITHUB_REF_NAME}"
          git push -f origin "${major_version}"
