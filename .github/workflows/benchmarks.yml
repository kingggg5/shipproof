name: Benchmarks

on:
  schedule:
    # Weekly, Monday 03:20 UTC — off-peak, deterministic runner pool.
    - cron: "20 3 * * 1"
  workflow_dispatch:
    inputs:
      run-realworld:
        description: "Also clone and scan public OSS repositories (network)"
        type: boolean
        default: false
      run-semgrep:
        description: "Also run the original Semgrep comparison ruleset on Linux (installs Semgrep)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detection-and-throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Detection head-to-head (self-leg, all fixture corpora)
        run: |
          python benchmarks/head_to_head.py \
            fixtures/vulnerable-node-api \
            fixtures/vulnerable-python-api \
            fixtures/node-taint-crossfile \
            fixtures/adversarial-node \
            fixtures/secure-node-api \
            fixtures/node-secure-crossfile \
            --repeat 3 --format json \
            --min-file-precision 0.95 --min-file-recall 0.95 \
            --min-line-precision 0.95 --min-line-recall 0.95 \
            | tee benchmark-detection.json
          python benchmarks/head_to_head.py \
            fixtures/vulnerable-node-api \
            fixtures/vulnerable-python-api \
            fixtures/node-taint-crossfile \
            fixtures/adversarial-node \
            fixtures/secure-node-api \
            fixtures/node-secure-crossfile \
            --repeat 3 --min-file-precision 0.95 --min-file-recall 0.95 \
            --min-line-precision 0.95 --min-line-recall 0.95 \
            | tee benchmark-detection.md
      - name: Throughput regression (1k files, 4 workers)
        run: |
          python scripts/benchmark-scanner.py --files 1000 --samples 3 --jobs 4 \
            --max-seconds 15 \
            | tee benchmark-throughput.json
      - name: Adversarial-regex and large-file bounds
        run: |
          python scripts/benchmark-scanner.py --files 250 --samples 3 \
            --profile adversarial-regex --bytes-per-file 4096 \
            --max-seconds 5 --max-memory-mb 256 \
            | tee benchmark-adversarial-regex.json
          python scripts/benchmark-scanner.py --files 8 --samples 3 \
            --profile adversarial-regex --bytes-per-file 524288 \
            --max-seconds 10 --max-memory-mb 256 \
            | tee benchmark-large-file.json
      - name: Shadow prototypes (advisory only)
        run: python scripts/eval-shadow-prototypes.py --json | tee benchmark-shadow-prototypes.json
      - name: Real-world open-source evaluation
        if: ${{ inputs.run-realworld == true }}
        run: python scripts/eval-realworld.py --json --labels | tee benchmark-realworld.json
      - name: Semgrep comparison (caller-supplied original ruleset)
        if: ${{ inputs.run-semgrep == true }}
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --version | tee benchmark-semgrep-version.txt
          python benchmarks/head_to_head.py \
            fixtures/vulnerable-node-api \
            fixtures/vulnerable-python-api \
            fixtures/node-taint-crossfile \
            fixtures/adversarial-node \
            fixtures/secure-node-api \
            fixtures/node-secure-crossfile \
            --semgrep-config benchmarks/semgrep-comparison/rules.yml \
            --repeat 3 --format json \
            | tee benchmark-semgrep-comparison.json
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipproof-benchmarks-${{ github.run_id }}
          path: |
            benchmark-detection.json
            benchmark-detection.md
            benchmark-throughput.json
            benchmark-adversarial-regex.json
            benchmark-large-file.json
            benchmark-shadow-prototypes.json
            benchmark-realworld.json
            benchmark-semgrep-version.txt
            benchmark-semgrep-comparison.json
          if-no-files-found: ignore
          retention-days: 90

  clean-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.85.0"
      - name: Clean-corpus precision evaluation
        run: python scripts/eval-clean-corpus.py --json --labels | tee benchmark-clean-corpus.json
      - name: Precision thresholds
        run: python scripts/check-precision-trend.py --report benchmark-clean-corpus.json
      - name: Upload clean-corpus artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipproof-clean-corpus-${{ github.run_id }}
          path: benchmark-clean-corpus.json
          if-no-files-found: error
          retention-days: 90
