[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".npm-cache", "tmp*", "tests/tmp*"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
